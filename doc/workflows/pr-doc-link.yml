name: "doc2gh: PR Documentation Traceability"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-doc-links:
    name: Link PR to ADRs, RFCs & Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze PR Documentation Context
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prText = `${pr.title}\n${pr.body || ''}`;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const docFiles = files
              .map(f => f.filename)
              .filter(name =>
                /(^|\/)(adrs|rfcs|specs)\/\d{4}-.*\.md$/.test(name)
              );

            const refMatches = prText.match(/\b(ADR|RFC|SPEC)-\d{4}\b/gi) || [];
            const uniqueRefs = [...new Set(refMatches.map(r => r.toUpperCase()))];

            const marker = '<!-- doc2gh-traceability -->';
            const lines = [
              marker,
              '### 📋 doc2gh Traceability Summary (Documentation & AI)',
              ''
            ];

            if (docFiles.length > 0) {
              lines.push('**Documents modified in this Pull Request:**');
              for (const file of docFiles) {
                lines.push(`- \`${file}\``);
              }
              lines.push('');
              lines.push(
                '> Remember: Always use `python3 tools/doc2gh.py` to update document `status` or GitHub Issue/PR links rather than editing the managed section manually.'
              );
              lines.push('');
            }

            if (uniqueRefs.length > 0) {
              lines.push('**Document references detected in PR title/description:**');
              for (const ref of uniqueRefs) {
                lines.push(`- \`${ref}\``);
              }
              lines.push('');
            }

            if (docFiles.length === 0 && uniqueRefs.length === 0) {
              lines.push(
                '> ℹ️ No direct reference to `ADR-NNNN`, `RFC-NNNN`, or `SPEC-NNNN` was detected in this Pull Request. ' +
                'If this change implements a specification or architectural decision, please reference its ID in the PR description.'
              );
            }

            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body
              });
            }
