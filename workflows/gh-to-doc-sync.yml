name: "doc2gh: Sync GitHub Issues & PRs to Documents"

on:
  issues:
    types: [opened, edited, labeled, closed, reopened]
  pull_request:
    types: [opened, edited, reopened, closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-github-to-docs:
    name: Update Managed Document Sections from GitHub Events
    runs-on: ubuntu-latest
    # Avoid running on bot-generated commits/comments except explicit /doc2gh slash commands
    if: >-
      github.actor != 'github-actions[bot]' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/doc2gh '))
    steps:
      - name: Determine target branch for checkout
        id: target-ref
        uses: actions/github-script@v7
        with:
          script: |
            let ref = (context.payload.repository && context.payload.repository.default_branch) || 'main';
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              if (pr.state === 'open' && pr.head.repo && pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`) {
                ref = pr.head.ref;
              } else {
                ref = pr.base.ref;
              }
            }
            core.setOutput('branch', ref);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target-ref.outputs.branch }}
          fetch-depth: 0

      - name: Collect modified files (for Pull Request events)
        id: pr-files
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const docFiles = files
              .map(f => f.filename)
              .filter(name => /(^|\/)(adrs|rfcs|specs)\/\d{4}-.*\.md$/.test(name));
            core.setOutput('files', docFiles.join(' '));

      - name: Run doc2gh CLI to apply GitHub event to documents
        shell: bash
        env:
          PR_MODIFIED_FILES: ${{ steps.pr-files.outputs.files || '' }}
        run: |
          set -euo pipefail
          FOUND=0
          CLI_BIN=""
          for candidate in "./tools/doc2gh.py" "doc/tools/doc2gh.py" "docs/tools/doc2gh.py"; do
            if [ -f "${candidate}" ] && python3 "${candidate}" --help 2>&1 | grep -q "gh-event"; then
              CLI_BIN="${candidate}"
              break
            fi
          done
          for prefix in "." "doc" "docs"; do
            if [ -f "${prefix}/tools/doc2gh.py" ]; then
              FOUND=1
              RUNNER="${CLI_BIN:-${prefix}/tools/doc2gh.py}"
              echo "Applying GitHub event '${GITHUB_EVENT_NAME}' via doc2gh in '${prefix}'..."
              if [ -n "${PR_MODIFIED_FILES}" ]; then
                # shellcheck disable=SC2086
                python3 "${RUNNER}" --root "${prefix}" gh-event --files ${PR_MODIFIED_FILES}
              else
                python3 "${RUNNER}" --root "${prefix}" gh-event
              fi
              python3 "${RUNNER}" --root "${prefix}" validate --include-templates
            fi
          done
          if [ "${FOUND}" -eq 0 ]; then
            echo "Error: Could not find tools/doc2gh.py in '.', 'doc/', or 'docs/'." >&2
            exit 1
          fi

      - name: Commit and push updated managed sections
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No document changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add adrs/ rfcs/ specs/ doc/adrs/ doc/rfcs/ doc/specs/ docs/adrs/ docs/rfcs/ docs/specs/ 2>/dev/null || true
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No managed document files changed."
            exit 0
          fi

          git commit -m "chore(doc2gh): sync document metadata from GitHub ${GITHUB_EVENT_NAME} event"
          git push origin "HEAD:${{ steps.target-ref.outputs.branch }}"
